# Regression tests for the DEVA11Y-484 decompression-bomb extraction guard.
# Builds the package (plugin + runner + library) and runs the real-process test suite:
# Swift unit tests against BrowserStackCLIKit plus the shell wrapper integration tests.
# macOS runner ships swift, bsdtar (libarchive), curl, and python3.
name: Extraction Guard Tests

on:
  pull_request:
    branches: ["master", "main"]
    paths:
      - "Package.swift"
      - "Sources/**"
      - "Plugins/BrowserStackAccessibilityLint/**"
      - "scripts/bash/cli.sh"
      - "scripts/zsh/cli.sh"
      - "scripts/fish/cli.sh"
      - "scripts/test/**"
      - ".github/workflows/extraction-guard-tests.yml"
  push:
    branches: ["master", "main"]

permissions:
  contents: read

jobs:
  extraction-guard:
    name: extraction-guard / integration
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@c85c95e3d7251135ab7dc9ce3241c5835cc595a9 # v3.5.3
      - name: Show toolchain
        run: swift --version && bsdtar --version && curl --version | head -1 && python3 --version
      - name: Build package (plugin + runner + library)
        run: swift build
      - name: Run DEVA11Y-484 regression suite
        run: bash scripts/test/run_tests.sh
