name: SPM dependency pin

# scripts/{bash,zsh,fish}/spm.sh generate a throwaway Package.swift that depends on
# this repository. It used to track `branch: "main"`, so every scan resolved
# whatever HEAD of main was at that moment (DEVA11Y-477 / F-005, CWE-829). It is
# now pinned to an immutable `revision:` SHA, and this workflow keeps that pin
# current without going back to a mutable ref:
#
#   bump  — when plugin code (Package.swift / Plugins/) lands on main, runs
#           .github/scripts/update-spm-pin.sh and opens (or refreshes) a PR moving
#           the pin to that commit. The bump goes through review like any other
#           change, so a bad commit on main does not reach users automatically.
#           Bump PRs only touch scripts/, so merging one never moves the pin again.
#   guard — on PRs touching scripts/, fails if any spm.sh stops pinning to a full
#           40-char revision (e.g. a revert back to `branch: "main"`).
#
# PRs opened with the default GITHUB_TOKEN do not trigger other workflows, so the
# required checks will not start on them on their own. Set a PIN_BUMP_TOKEN secret
# (GitHub App installation token or fine-grained PAT with contents + pull-requests
# write) to have them run; without it, close/reopen the bump PR to start checks.

on:
  push:
    branches: [main]
    paths:
      - 'Package.swift'
      - 'Plugins/**'
  pull_request:
    paths:
      - 'scripts/**'
      - '.github/scripts/update-spm-pin.sh'
      - '.github/workflows/spm-pin-bump.yml'
  schedule:
    - cron: '0 6 * * 1' # weekly safety net in case a push run was missed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bump:
    name: Open PR bumping the SPM pin
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: spm-pin-bump
      cancel-in-progress: false
    env:
      BUMP_BRANCH: ci/spm-pin-bump
      GH_TOKEN: ${{ secrets.PIN_BUMP_TOKEN || github.token }}
    steps:
      - name: Checkout main (full history to find the latest plugin commit)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.PIN_BUMP_TOKEN || github.token }}

      - name: Update pin in spm.sh scripts and sidecars
        id: pin
        run: |
          set -euo pipefail
          old=$(grep -oE 'AccessibilityDevTools\.git", revision: "[0-9a-f]{40}"' scripts/bash/spm.sh \
                | grep -oE '[0-9a-f]{40}' || true)
          new=$(.github/scripts/update-spm-pin.sh)
          echo "old=${old}" >> "$GITHUB_OUTPUT"
          echo "new=${new}" >> "$GITHUB_OUTPUT"
          if git diff --quiet; then
            echo "Pin already at ${new}; nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push bump branch and open/update PR
        if: steps.pin.outputs.changed == 'true'
        env:
          OLD: ${{ steps.pin.outputs.old }}
          NEW: ${{ steps.pin.outputs.new }}
        run: |
          set -euo pipefail
          short="${NEW:0:12}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C "$BUMP_BRANCH"
          git commit -qam "chore(spm): pin AccessibilityDevTools dependency to ${short} (DEVA11Y-477)"
          # The bump branch is bot-owned and always rebuilt from main.
          git push --force origin "HEAD:refs/heads/${BUMP_BRANCH}"

          {
            echo "Moves the \`revision:\` pin in the Package.swift generated by \`scripts/{bash,zsh,fish}/spm.sh\` to \`${NEW}\`, the latest commit on \`main\` that changed the plugin, and regenerates the \`.sha256\` self-update sidecars."
            echo
            if [ -n "$OLD" ]; then
              echo "Plugin changes since the previous pin \`${OLD:0:12}\`:"
              echo
              echo '```'
              git log --first-parent --format='%h %s' "${OLD}..${NEW}" -- Package.swift Plugins
              echo '```'
              echo
            fi
            echo "Review those changes before merging: once merged, every \`spm.sh\` scan resolves the plugin at this commit."
            echo
            echo "Opened automatically by \`.github/workflows/spm-pin-bump.yml\` (DEVA11Y-477)."
          } > "$RUNNER_TEMP/pr-body.md"

          pr=$(gh pr list --head "$BUMP_BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --title "chore(spm): pin AccessibilityDevTools dependency to ${short}" --body-file "$RUNNER_TEMP/pr-body.md"
            echo "Updated PR #${pr}"
          else
            gh pr create --base main --head "$BUMP_BRANCH" \
              --title "chore(spm): pin AccessibilityDevTools dependency to ${short}" \
              --body-file "$RUNNER_TEMP/pr-body.md"
          fi

  guard:
    name: spm.sh pins a full commit SHA
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Require revision pin in every spm.sh
        run: |
          set -uo pipefail
          status=0
          for script in scripts/bash/spm.sh scripts/zsh/spm.sh scripts/fish/spm.sh; do
            if grep -Eq '\.package\(url: "https://github\.com/browserstack/AccessibilityDevTools\.git", revision: "[0-9a-f]{40}"\)' "$script"; then
              echo "OK      $script"
            else
              echo "FAILED  $script must pin AccessibilityDevTools with revision: \"<40-char sha>\" (DEVA11Y-477); run .github/scripts/update-spm-pin.sh"
              status=1
            fi
          done
          exit "$status"
